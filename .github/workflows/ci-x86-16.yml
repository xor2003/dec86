name: CI x86-16 Focused Tests

on: [push, pull_request]

jobs:
  x86_16_tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ".[dev]"

      - name: Run Ruff
        run: |
          make ruff

      - name: Run Pyright
        run: |
          make pyright

      - name: Run Vulture
        run: |
          make vulture

      - name: Run Radon
        run: |
          make radon

      - name: Run Pytest
        run: |
          make pytest
