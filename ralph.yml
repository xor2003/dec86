event_loop:
  completion_promise: LOOP_COMPLETE
  max_iterations: 150
  max_runtime_seconds: 28800
  idle_timeout_secs: 1800
  starting_event: work.start

cli:
  backend: codex
  prompt_mode: arg

core:
  scratchpad: .ralph/agent/scratchpad.md
  specs_dir: ./specs/
  guardrails:
    - "Use AGENTS.md as the architecture contract. Solve at earliest correct layer; rewrite is cleanup only."
    - "Do not execute full SORTDEMO decompilation. Use one-function --addr runs only."
    - "Primary lane is SORTDEMO.EXE quality; prioritize correctness and attribution over prettiness."
    - "Never use rendered C/ASM text matching as semantic proof."
    - "Never claim complete if validation is changed/unknown/uncollected."
    - "Use PLAN.md and remove only steps that are done and verified by tests or decompile.py evidence."
    - "Keep changes deterministic and evidence-backed. No sample-specific hacks."

memories:
  enabled: true
  inject: auto
  budget: 2500

tasks:
  enabled: true
  path: .ralph/agent/tasks.jsonl

hats:
  sweeper:
    name: "Sweep"
    description: "Collect fresh focused evidence for the current lane"
    triggers: ["work.start"]
    publishes: ["sweep.done"]
    default_publishes: "sweep.done"
    instructions: |
      Run the focused sweep command exactly:
      ./.venv/bin/python -u decompile.py "${PWD}/SORTDEMO.EXE" --timeout 6 --max-functions 8

      Capture key outputs into:
      - .codex_automation/evidence.log
      - .ralph/agent/sweep.latest.md (create/update with concise summary)

      Keep this lane scan-safe:
      - do not run full SORTDEMO
      - keep function runs bounded
      - classify failures honestly (changed/unknown/uncollected/decompile failure)

  checker:
    name: "Checker"
    description: "Validate evidence quality and classify failure families"
    triggers: ["sweep.done"]
    publishes: ["checker.done"]
    default_publishes: "checker.done"
    instructions: |
      Read:
      - AGENTS.md
      - PLAN.md
      - .codex_automation/evidence.log
      - .ralph/agent/sweep.latest.md

      Produce:
      - .ralph/agent/check.latest.md with:
        - top failure families
        - focused addresses/functions
        - exact verification commands for one-function repros
      No code edits.

  planner:
    name: "Planner"
    description: "Update PLAN.md only from checked evidence"
    triggers: ["checker.done", "review.changes_requested"]
    publishes: ["plan.ready"]
    default_publishes: "plan.ready"
    instructions: |
      Update PLAN.md using checker evidence.
      Rules:
      - keep flat numbered checklist
      - each item has files, functions, known line ranges, deterministic DoD
      - remove only done steps with proof (tests or focused decompile.py)
      - split slow items into smaller deterministic steps
      - keep strategic unfinished items unless superseded by tighter replacements
      No implementation in this hat.

  worker:
    name: "Worker"
    description: "Implement PLAN.md steps"
    triggers: ["plan.ready"]
    publishes: ["implementation.done"]
    default_publishes: "implementation.done"
    instructions: |
      Implement the next unfinished PLAN.md step.
      Constraints:
      - follow AGENTS.md architecture strictly
      - one-function decompile verification only
      - no full SORTDEMO run
      - no semantic fixes in CLI rewrite layer
      - keep uncertainty explicit when proof is weak

      Verify with targeted pytest + focused decompile.py --addr commands from PLAN.md.
      Record what changed and what remains in .ralph/agent/worker.latest.md.

  reviewer:
    name: "Reviewer"
    description: "Gate correctness and prune finished PLAN items"
    triggers: ["implementation.done"]
    publishes: ["review.approved", "review.changes_requested"]
    default_publishes: "review.approved"
    instructions: |
      Review code + evidence.
      Blocking conditions:
      - architecture layer violation
      - no deterministic DoD proof
      - hidden fallback presented as success
      - full sortdemo used instead of focused one-function validation

      On pass:
      - prune finished PLAN.md items
      - write .ralph/agent/review.latest.md
      - emit review.approved

      On fail:
      - emit review.changes_requested with exact file:line/function feedback.

  crash_reviewer:
    name: "Crash Reviewer"
    description: "Classify crashes/timeouts and propose bounded next action"
    triggers: ["role.timed_out", "role.failed", "sweep.failed"]
    publishes: ["checker.done"]
    default_publishes: "checker.done"
    instructions: |
      Produce .ralph/agent/crash.latest.md with:
      - failing command
      - first failing address/function when available
      - bounded repro command
      - concrete next-step patch direction at earliest architectural layer.

  finalizer:
    name: "Finalizer"
    description: "Close loop when reviewer approves"
    triggers: ["review.approved"]
    publishes: ["LOOP_COMPLETE"]
    instructions: |
      Confirm current primary task in .ralph/agent/tasks.jsonl is complete with evidence.
      Add completion note to .ralph/agent/final.latest.md.
      Emit LOOP_COMPLETE.
