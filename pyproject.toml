[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vextest-x86-16"
version = "0.1"
description = "angr-based 16-bit x86 real-mode decompiler workspace"
readme = "angr_platforms/README.md"
requires-python = ">=3.11"
dependencies = [
    "angr==9.2.205",
    "archinfo==9.2.205",
    "cle==9.2.205",
    "claripy==9.2.205",
    "pyvex==9.2.205",
    "capstone==5.0.6",
    "textual==8.2.1",
    "z3-solver==4.13.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=9,<10",
    "keystone-engine==0.9.2",
    "monkeytype",
]
dev = [
    "pytest>=9,<10",
    "keystone-engine==0.9.2",
    "monkeytype",
    "mypy",
    "opentelemetry-api>=1.28,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.28,<2",
    "opentelemetry-sdk>=1.28,<2",
    "ruff",
    "pyright",
    "vulture",
    "radon",
]
mypyc = [
    "mypy",
]

[project.scripts]
decompile-x86-16 = "decompile:main"

[tool.setuptools]
package-dir = {"" = "angr_platforms"}

[tool.setuptools.packages.find]
where = ["angr_platforms"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [
    ".venv",
    "angr_platforms/vextest_x86_16.egg-info",
    "build",
    "dist",
    "examples/build_msc6",
    "examples/build_msc6_tiny",
]

[tool.ruff.lint]
select = [
    "ANN",
    "D",
    "E",
    "F",
    "I",
]
ignore = [
    "E501",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"angr_platforms/tests/*.py" = ["ANN", "D", "E402"]
"scripts/*.py" = ["D"]

[tool.mypy]
python_version = "3.11"
files = [
    "angr_platforms/angr_platforms/X86_16",
    "angr_platforms/tests/test_x86_16_smoketest.py",
    "angr_platforms/tests/test_x86_16_cod_samples.py",
    "angr_platforms/tests/test_x86_16_dos_mz_loader.py",
    "angr_platforms/tests/test_x86_16_sample_matrix.py",
    "angr_platforms/tests/test_x86_16_runtime_samples.py",
    "angr_platforms/tests/test_x86_16_compare_semantics.py",
    "angr_platforms/tests/conftest.py",
]
ignore_missing_imports = true
check_untyped_defs = true
pretty = true
show_error_codes = true
warn_unused_ignores = true
exclude = [
    "build/",
    "dist/",
    "angr_platforms/angr_platforms.egg-info/",
]

[tool.pytest.ini_options]
testpaths = [
    "angr_platforms/tests",
]

[tool.pyright]
include = [
    "angr_platforms/angr_platforms/X86_16",
    "angr_platforms/tests",
    "inertia_decompiler",
]
exclude = [
    "**/__pycache__",
    ".venv",
    "build",
    "dist",
]
pythonVersion = "3.11"
typeCheckingMode = "basic"

[tool.vulture]
exclude = [
    ".venv/",
    "build/",
    "dist/",
    "__pycache__/",
    ".pytest_cache/",
    ".mypy_cache/",
    ".ruff_cache/",
]
ignore_names = [
    "test_*",
    "pytest_*",
]
min_confidence = 80
