[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vextest-x86-16"
version = "0.1"
description = "angr-based 16-bit x86 real-mode decompiler workspace"
readme = "angr_platforms/README.md"
requires-python = ">=3.14"
dependencies = [
    "angr==9.3.3",
    "archinfo==9.3.3",
    "cle==9.3.3",
    "claripy==9.3.3",
    "pyvex==9.3.3",
    "capstone==5.0.9",
    "pycparser>=3,<4",
    "textual==8.2.8",
    "z3-solver==4.13.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=9,<10",
    "pytest-xdist>=3.8,<4",
    "keystone-engine==0.9.2",
    "monkeytype",
]
dev = [
    "pytest>=9,<10",
    "pytest-xdist>=3.8,<4",
    "keystone-engine==0.9.2",
    "monkeytype",
    "mypy",
    "opentelemetry-api>=1.28,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.28,<2",
    "opentelemetry-sdk>=1.28,<2",
    "ruff",
    "pyright",
    "vulture",
    "lizard",
]
mypyc = [
    "mypy",
    "setuptools",
]

[project.scripts]
decompile-x86-16 = "decompile:main"

[tool.setuptools]
package-dir = {"" = "angr_platforms"}

[tool.setuptools.packages.find]
where = ["angr_platforms"]

[tool.ruff]
line-length = 120
target-version = "py314"
extend-exclude = [
    ".venv",
    "angr_platforms/vextest_x86_16.egg-info",
    "build",
    "dist",
    "examples/build_msc6",
    "examples/build_msc6_tiny",
]

[tool.ruff.lint]
select = [
    "ANN",
    "D",
    "E",
    "F",
    "I",
    "PERF",
    "B",
    "C4",
    "LOG",
    "PIE",
    "RSE",
    "RUF",
    "SIM",
    "UP",
]
ignore = [
    "E501",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"angr_platforms/tests/*.py" = ["ANN", "D", "E402"]
"angr_platforms/angr_platforms/X86_16/analysis_helpers.py" = ["D"]
"angr_platforms/angr_platforms/X86_16/annotations.py" = ["D"]
"angr_platforms/angr_platforms/X86_16/ir/condition_ir.py" = ["ANN", "D"]
"angr_platforms/angr_platforms/X86_16/lift_86_16.py" = ["ANN", "D"]
"angr_platforms/angr_platforms/X86_16/lowering/condition_transfer.py" = ["D"]
"angr_platforms/angr_platforms/X86_16/lowering/segmented_global_loads.py" = ["D"]
"angr_platforms/angr_platforms/X86_16/lowering/stack_lowering_impl.py" = ["ANN", "D"]
"angr_platforms/angr_platforms/X86_16/pipeline/contracts.py" = ["D"]
"angr_platforms/angr_platforms/X86_16/segmented_memory_reasoning.py" = ["D"]
"angr_platforms/angr_platforms/X86_16/widening/widening_copyprop_8616.py" = ["D"]
"angr_platforms/angr_platforms/X86_16/widening/widening_memory_fold_8616.py" = ["D"]
"angr_platforms/angr_platforms/X86_16/widening/segmented_load_identity.py" = ["D"]
"angr_platforms/angr_platforms/X86_16/widening/segmented_load_widening.py" = ["D"]
"angr_platforms/angr_platforms/X86_16/tail_validation_fingerprint.py" = ["ANN", "D"]
"angr_platforms/angr_platforms/X86_16/callsite_summary.py" = ["D"]
"angr_platforms/angr_platforms/X86_16/decompiler_postprocess.py" = ["ANN", "D"]
"angr_platforms/angr_platforms/X86_16/decompiler_postprocess_jcc.py" = ["ANN", "D"]
"angr_platforms/angr_platforms/X86_16/decompiler_postprocess_utils.py" = ["ANN", "D"]
"angr_platforms/angr_platforms/X86_16/decompiler_return_compat.py" = ["ANN", "D"]
"angr_platforms/angr_platforms/X86_16/render_compat.py" = ["D"]
"angr_platforms/angr_platforms/X86_16/type_array_matching.py" = ["D"]
"angr_platforms/angr_platforms/X86_16/stack_probe_fact_trace.py" = ["ANN", "D"]
"inertia_decompiler/cli.py" = ["D", "F822"] # Lazy exports are resolved by the typed module boundary.
"inertia_decompiler/cli_c_text_postprocess.py" = ["ANN", "D"]
"inertia_decompiler/cli_decompilation.py" = ["ANN", "D"]
"inertia_decompiler/runtime_support.py" = ["ANN", "D"]
"omf_pat.py" = ["ANN", "D"]
"scripts/decompile_cod_dir.py" = ["ANN", "D", "E402"]
"scripts/*.py" = ["D"]

[tool.mypy]
python_version = "3.14"
files = [
    "angr_platforms/angr_platforms/X86_16",
    "inertia_decompiler",
    "scripts",
    "decompile.py",
    "monkeytype_config.py",
    "omf_pat.py",
]
strict = true
follow_imports = "skip"
no_site_packages = true
incremental = true
cache_dir = ".mypy_cache"
ignore_missing_imports = true
check_untyped_defs = true
pretty = true
show_error_codes = true
warn_unused_ignores = true
exclude = [
    "build/",
    "dist/",
    "angr_platforms/angr_platforms.egg-info/",
]

[tool.pytest.ini_options]
testpaths = [
    "angr_platforms/tests",
]
markers = [
    "repository_contract: validates current whole-repository state and runs as an explicit hard gate outside focused pytest lanes",
    "resource_serial: requires an exclusive partitioned-suite wave because external tools or shared resources become unreliable under heavy contention",
]
addopts = [
    "--durations=10",
    "--durations-min=1.0",
]

[tool.pyright]
include = [
    "angr_platforms/angr_platforms/X86_16",
    "angr_platforms/tests",
    "inertia_decompiler",
]
extraPaths = [
    "angr_platforms",
]
exclude = [
    "**/__pycache__",
    ".venv",
    "build",
    "dist",
]
pythonVersion = "3.11"
typeCheckingMode = "basic"

[tool.vulture]
exclude = [
    ".venv/",
    "build/",
    "dist/",
    "__pycache__/",
    ".pytest_cache/",
    ".mypy_cache/",
    ".ruff_cache/",
]
ignore_names = [
    "test_*",
    "pytest_*",
]
min_confidence = 80
